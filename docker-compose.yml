services:
  database:
    container_name: database
    image: timescale/timescaledb:2.14.2-pg16
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrator:
    container_name: migrator
    image: flyway/flyway:10
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - /src/main/resources/database/migration:/flyway/sql:ro
    command: >
      -url=jdbc:postgresql://database:5432/${DATABASE_NAME}
      -user=${DATABASE_USER}
      -password=${DATABASE_PASSWORD}
      -schemas=${DATABASE_NAME}
      -locations=filesystem:/flyway/sql
      -connectRetries=60
      -baselineOnMigrate=true
      migrate
    profiles: [ "migrate" ]

  application:
    container_name: application
    build:
      context: .  # Use the current directory for the build context
      dockerfile: application.Dockerfile
    image: accommodation-booking-api:dev
    depends_on:
      database:
        condition: service_healthy
    ports: [ "8080:8080" ]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${DATABASE_NAME}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "30000"   # optional; default 30s
    restart: unless-stopped

volumes:
  dbdata: